name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all lib modules
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/fetch-utils.js
          node --check lib/emrank.js
          node --check lib/screener.js
          node --check lib/screener-validate.js
          node --check lib/screener-cache.js
          node --check lib/signals.js
          node --check lib/indicators.js
          node --check lib/search-index.js
          node --check lib/sinarank.js
          node --check build.mjs
          for f in src/client/*.js; do node --check "$f"; done
          echo "✓ All lib modules + build script + client sources pass syntax check"

  client-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install esbuild (pinned by lockfile)
        run: npm ci
      - name: Rebuild client bundle
        run: npm run build
      - name: Committed bundle must match sources
        run: |
          rc=0
          git diff --quiet lib/client.js || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "✓ 提交的 lib/client.js 与源码重建结果一致"
            exit 0
          fi
          # 诊断：产物过期时把差异直接说出来（annotation 走公开 API 可读，
          # 而 job 日志需要仓库权限），否则 CI 红了却看不到差在哪。
          INFO=$( {
            echo "git diff exit=$rc"
            git --version
            node -p "'node '+process.version+' '+process.platform"
            node -p "'esbuild '+require('esbuild/package.json').version"
            echo "core.autocrlf=$(git config core.autocrlf)"
            git check-attr -a lib/client.js
            node -e "const b=require('fs').readFileSync('lib/client.js');let cr=0;for(const x of b)if(x===13)cr++;console.log('size='+b.length+' CR='+cr+' sha='+require('crypto').createHash('sha256').update(b).digest('hex').slice(0,16))"
            git diff --numstat lib/client.js
            git diff --text lib/client.js | head -60
            node -e 'const e=require("esbuild");console.log("CWD="+process.cwd());console.log("PKGTYPE="+require("./package.json").type);e.build({entryPoints:["src/client/entry.js"],bundle:true,format:"cjs",platform:"browser",external:["react","react-dom/client"],metafile:true,write:false,charset:"utf8",target:"esnext"}).then(r=>{for(const [k,v] of Object.entries(r.metafile.inputs))console.log("INPUT "+k+" fmt="+v.format);const t=new TextDecoder().decode(r.outputFiles[0].contents);console.log("HEAD_NOBANNER="+JSON.stringify(t.split("\n").slice(0,3)));});'
          } 2>&1 )
          printf '%s\n' "$INFO"
          {
            echo '### lib/client.js 与源码重建结果不一致'
            echo '```diff'
            printf '%s\n' "$INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ONE=$(printf '%s' "$INFO" | tr -d '\r' | tr '\n' '~' | cut -c1-1200)
          echo "::error::lib/client.js 过期或与本机产物不一致（改 src/client/* 后请 npm run build 并提交）:: $ONE"
          exit 1

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 直接走 npm test：package.json 的 scripts.test 是测试清单的唯一来源。
      # 这里曾经手抄了一份同样的列表，抄漏了三个（p0-position-alerts /
      # p0-minute-fflow / p1-f10-longhu）——它们在本地 npm test 里一直是绿的，
      # 却从没在 CI 上跑过。新增测试时不用再回来改这个文件。
      # 测试全部无网络、且不需要 node_modules（client-bundle-test 只读产物），
      # 所以本 job 不需要 npm ci。
      - name: Run stubbed regression tests (no network)
        run: npm test
        shell: bash
      - name: Log results for CI dashboard
        if: always()
        run: echo "Unit test suite completed with exit code $?"

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate package.json DSH manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch) { console.error('missing dsh.bundle.patch manifest'); process.exit(1); } if(!p.files||!p.files.includes('cordis.patch.yml')) { console.error('cordis.patch.yml must ship in files'); process.exit(1); }"
