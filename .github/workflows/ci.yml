name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all lib modules
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/fetch-utils.js
          node --check lib/emrank.js
          node --check lib/screener.js
          node --check lib/screener-validate.js
          node --check lib/screener-cache.js
          node --check lib/signals.js
          node --check lib/indicators.js
          node --check lib/search-index.js
          node --check lib/sinarank.js
          node --check build.mjs
          for f in src/client/*.js; do node --check "$f"; done
          echo "✓ All lib modules + build script + client sources pass syntax check"

  client-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install esbuild (pinned by lockfile)
        run: npm ci
      - name: Rebuild client bundle
        run: npm run build
      - name: Committed bundle must match sources
        run: |
          if ! git diff --exit-code --stat lib/client.js; then
            echo "::error::lib/client.js is stale — edit src/client/* and run npm run build, then commit the result"
            exit 1
          fi

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 直接走 npm test：package.json 的 scripts.test 是测试清单的唯一来源。
      # 这里曾经手抄了一份同样的列表，抄漏了三个（p0-position-alerts /
      # p0-minute-fflow / p1-f10-longhu）——它们在本地 npm test 里一直是绿的，
      # 却从没在 CI 上跑过。新增测试时不用再回来改这个文件。
      # 测试全部无网络、且不需要 node_modules（client-bundle-test 只读产物），
      # 所以本 job 不需要 npm ci。
      - name: Run stubbed regression tests (no network)
        run: npm test
        shell: bash
      - name: Log results for CI dashboard
        if: always()
        run: echo "Unit test suite completed with exit code $?"

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate package.json DSH manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch) { console.error('missing dsh.bundle.patch manifest'); process.exit(1); } if(!p.files||!p.files.includes('cordis.patch.yml')) { console.error('cordis.patch.yml must ship in files'); process.exit(1); }"
