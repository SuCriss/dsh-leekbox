name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Syntax-check all lib modules
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check lib/fetch-utils.js
          node --check lib/emrank.js
          node --check lib/screener.js
          node --check lib/search-index.js
          node --check lib/sinarank.js
          echo "✓ All 7 lib modules pass syntax check"

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Run stubbed regression tests (no network)
        run: |
          npm install --if-present
          node verify-fixes.mjs
          node pinyin-test.mjs
          node news-dedup-test.mjs
          node sentiment-score-test.mjs
          node error-text-test.mjs
          node p0-universe-delta-test.mjs
          node p1-screener-cache-test.mjs
          node p1-p2-stream-test.mjs
          node p2-sse-route-test.mjs
        shell: bash
      - name: Log results for CI dashboard
        if: always()
        run: echo "Unit test suite completed with exit code $?"

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate package.json DSH manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh||!p.dsh.bundle||!p.dsh.bundle.patch) { console.error('missing dsh.bundle.patch manifest'); process.exit(1); } if(!p.files||!p.files.includes('cordis.patch.yml')) { console.error('cordis.patch.yml must ship in files'); process.exit(1); }"
